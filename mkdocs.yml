site_name: EmbedIDS
site_author: Linuscent Ltd
site_url: https://embedids.linuscent.com/
site_description: >-
  EmbedIDS is a lightweight, open-source runtime Intrusion Detection SDK for
  low-power embedded and IoT devices, providing on-device anomaly detection
  with no dynamic memory allocation.
repo_url: https://github.com/Linuscent/EmbedIDS
docs_dir: "docs"

# Surface broken internal links and anchors at build time.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/embedIDS_logo.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
      # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
      primary: white
      accent: red
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to system preference
      primary: red
      accent: red

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - header.autohide
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Linuscent/EmbedIDS
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/linuscent
  analytics:
    provider: google
    property: G-5ZPJDQ0248
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/Linuscent/EmbedIDS/issues/new?title=[Docs]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mike
  - social
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: Linuscent/EmbedIDS
      branch: main
      token: !ENV [MKDOCS_GIT_COMMITTERS_APIKEY, ""]
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Tutorial: tutorial.md
  - Case Studies:
      - case-studies/index.md
      - Runtime Security for Edge AI: case-studies/edgeml-runtime-security.md

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

copyright: Copyright &copy; 2026 Linuscent Ltd –
  <a href="#__consent">Change cookie settings</a>
