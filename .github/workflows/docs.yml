name: Documentation

on:
  push:
    branches: [main, 'v*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_VERSION: ${{ startsWith(github.ref, 'refs/heads/v') && github.ref_name || 'main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: page dates (structured data, sitemap lastmod, "Last updated") come from git.
          fetch-depth: 0
      # v6 is the first release that supports pnpm 11 (pinned in package.json).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:links
      - run: pnpm check:seo
      - name: Keep published URLs, anchors and assets
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p "$RUNNER_TEMP/published"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/published"
          if [ -d "$RUNNER_TEMP/published/$DOCS_VERSION" ]; then
            pnpm check:urls "$RUNNER_TEMP/published/$DOCS_VERSION" dist
          else
            echo "No published $DOCS_VERSION yet; nothing to compare."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    env:
      DOCS_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: dist
      - name: Update the published version
        run: |
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          node scripts/publish-docs.mjs "$RUNNER_TEMP/gh-pages"
      - name: Publish to GitHub Pages
        run: |
          cd "$RUNNER_TEMP/gh-pages"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish ${DOCS_VERSION}"
            git push origin HEAD:gh-pages
          fi
