<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="EmbedIDS on Zephyr RTOS case study">
  <title>EmbedIDS on Zephyr RTOS: runtime security inside the firmware</title>
  <style>
    .pkt { animation: pkt 1.6s cubic-bezier(.45,0,.55,1) infinite; }
    .pkt-out { animation: pkt-out 1.6s cubic-bezier(.45,0,.55,1) infinite .8s; }
    .cell { fill: #22d3ee; opacity: .12; animation: cell 2.8s ease-in-out infinite; }
    .ring { transform-origin: 1052px 214px; animation: ring 6s linear infinite; }
    .beat { transform-origin: 661px 282px; animation: beat 1s ease-out infinite; }
    .alert { animation: alert 2.8s ease-in-out infinite; }
    @keyframes pkt { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(60px); opacity: 0; } }
    @keyframes pkt-out { from { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateX(56px); opacity: 0; } }
    @keyframes cell { 0%, 100% { opacity: .12; } 35%, 60% { opacity: .9; } }
    @keyframes ring { to { transform: rotate(360deg); } }
    @keyframes beat { 0%, 60% { transform: scale(1); } 15% { transform: scale(1.6); } }
    @keyframes alert { 0%, 40% { opacity: .35; } 55%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .pkt, .pkt-out, .cell, .ring, .beat, .alert { animation: none; }
      .cell { opacity: .55; }
      .pkt, .pkt-out { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-alert" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f74d67" stop-opacity=".25"/>
      <stop offset="1" stop-color="#f74d67" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="440" rx="22" fill="#05060a"/>
  <rect width="1200" height="440" rx="22" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="21.5" fill="none" stroke="#22d3ee" stroke-opacity=".22"/>
  <circle cx="1052" cy="214" r="170" fill="url(#glow)"/>
  <circle cx="1060" cy="330" r="110" fill="url(#glow-alert)"/>

  <g font-family="'Space Grotesk', Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="56" y="124" fill="#e5e7eb" font-size="46" font-weight="700" letter-spacing="-1">Runtime security</text>
    <text x="56" y="178" fill="#e5e7eb" font-size="46" font-weight="700" letter-spacing="-1">on <tspan fill="#22d3ee">Zephyr RTOS</tspan></text>
  </g>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="56" y="220" fill="#adb4c2" font-size="17">EmbedIDS inside the firmware: a bounded queue, one</text>
    <text x="56" y="244" fill="#adb4c2" font-size="17">detector thread and no heap allocation.</text>
    <g>
      <rect x="56" y="282" width="168" height="66" rx="12" fill="#0a0c14" stroke="#242b3a"/>
      <text x="74" y="312" fill="#e5e7eb" font-size="25" font-weight="700">≤ 120 ms</text>
      <text x="74" y="335" fill="#8993a5" font-size="12.5">trigger to alert sample</text>
      <rect x="238" y="282" width="168" height="66" rx="12" fill="#0a0c14" stroke="#242b3a"/>
      <text x="256" y="312" fill="#e5e7eb" font-size="25" font-weight="700">640 B</text>
      <text x="256" y="335" fill="#8993a5" font-size="12.5">metric history, 8 rules</text>
      <rect x="420" y="282" width="168" height="66" rx="12" fill="#0a0c14" stroke="#242b3a"/>
      <text x="438" y="312" fill="#e5e7eb" font-size="25" font-weight="700">19 / 19</text>
      <text x="438" y="335" fill="#8993a5" font-size="12.5">Zephyr adapter tests</text>
    </g>
    <text x="56" y="392" fill="#6e7a90" font-size="12">Simulated Edge AI device on native_sim · Zephyr v4.2.0 · not a hardware benchmark</text>

    <text x="648" y="112" fill="#22d3ee" font-size="10.5" font-weight="600" letter-spacing="1.5" font-family="'JetBrains Mono', ui-monospace, monospace">APPLICATION</text>
    <g><rect x="648" y="128" width="138" height="28" rx="7" fill="#0a0c14" stroke="#1d3b47"/>
      <circle cx="661" cy="142" r="3.5" fill="#22d3ee"/>
      <text x="672" y="146" fill="#e5e7eb" font-size="11.5" font-weight="600">mode</text></g><g><rect x="648" y="163" width="138" height="28" rx="7" fill="#0a0c14" stroke="#f74d67"/>
      <circle cx="661" cy="177" r="3.5" fill="#f74d67"/>
      <text x="672" y="181" fill="#e5e7eb" font-size="11.5" font-weight="600">inference</text></g><g><rect x="648" y="198" width="138" height="28" rx="7" fill="#0a0c14" stroke="#1d3b47"/>
      <circle cx="661" cy="212" r="3.5" fill="#22d3ee"/>
      <text x="672" y="216" fill="#e5e7eb" font-size="11.5" font-weight="600">config</text></g><g><rect x="648" y="233" width="138" height="28" rx="7" fill="#0a0c14" stroke="#1d3b47"/>
      <circle cx="661" cy="247" r="3.5" fill="#22d3ee"/>
      <text x="672" y="251" fill="#e5e7eb" font-size="11.5" font-weight="600">dispatcher</text></g><g><rect x="648" y="268" width="138" height="28" rx="7" fill="#0a0c14" stroke="#1d3b47"/>
      <circle cx="661" cy="282" r="3.5" fill="#22d3ee" class="beat"/>
      <text x="672" y="286" fill="#e5e7eb" font-size="11.5" font-weight="600">heartbeat</text></g>
    <line x1="786" y1="142" x2="846" y2="142" stroke="#1d3b47" stroke-width="1.2"/><circle class="pkt" cx="786" cy="142" r="2.6" fill="#22d3ee" style="animation-delay:0.00s"/><line x1="786" y1="177" x2="846" y2="177" stroke="#f74d67" stroke-width="1.2"/><circle class="pkt" cx="786" cy="177" r="2.6" fill="#f74d67" style="animation-delay:0.27s"/><line x1="786" y1="212" x2="846" y2="212" stroke="#1d3b47" stroke-width="1.2"/><circle class="pkt" cx="786" cy="212" r="2.6" fill="#22d3ee" style="animation-delay:0.54s"/><line x1="786" y1="247" x2="846" y2="247" stroke="#1d3b47" stroke-width="1.2"/><circle class="pkt" cx="786" cy="247" r="2.6" fill="#22d3ee" style="animation-delay:0.81s"/><line x1="786" y1="282" x2="846" y2="282" stroke="#1d3b47" stroke-width="1.2"/><circle class="pkt" cx="786" cy="282" r="2.6" fill="#22d3ee" style="animation-delay:1.08s"/>

    <text x="889" y="116" fill="#22d3ee" font-size="10.5" font-weight="600" letter-spacing="1.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">K_MSGQ</text>
    <rect x="846" y="128" width="88" height="168" rx="9" fill="#0a0c14" stroke="#22d3ee" stroke-opacity=".4"/>
    <rect class="cell" x="852" y="134" width="16" height="16" rx="3" style="animation-delay:0.00s"/><rect class="cell" x="872" y="134" width="16" height="16" rx="3" style="animation-delay:0.12s"/><rect class="cell" x="892" y="134" width="16" height="16" rx="3" style="animation-delay:0.24s"/><rect class="cell" x="912" y="134" width="16" height="16" rx="3" style="animation-delay:0.36s"/><rect class="cell" x="852" y="154" width="16" height="16" rx="3" style="animation-delay:0.48s"/><rect class="cell" x="872" y="154" width="16" height="16" rx="3" style="animation-delay:0.60s"/><rect class="cell" x="892" y="154" width="16" height="16" rx="3" style="animation-delay:0.72s"/><rect class="cell" x="912" y="154" width="16" height="16" rx="3" style="animation-delay:0.84s"/><rect class="cell" x="852" y="174" width="16" height="16" rx="3" style="animation-delay:0.05s"/><rect class="cell" x="872" y="174" width="16" height="16" rx="3" style="animation-delay:0.17s"/><rect class="cell" x="892" y="174" width="16" height="16" rx="3" style="animation-delay:0.29s"/><rect class="cell" x="912" y="174" width="16" height="16" rx="3" style="animation-delay:0.41s"/><rect class="cell" x="852" y="194" width="16" height="16" rx="3" style="animation-delay:0.53s"/><rect class="cell" x="872" y="194" width="16" height="16" rx="3" style="animation-delay:0.65s"/><rect class="cell" x="892" y="194" width="16" height="16" rx="3" style="animation-delay:0.77s"/><rect class="cell" x="912" y="194" width="16" height="16" rx="3" style="animation-delay:0.89s"/><rect class="cell" x="852" y="214" width="16" height="16" rx="3" style="animation-delay:0.10s"/><rect class="cell" x="872" y="214" width="16" height="16" rx="3" style="animation-delay:0.22s"/><rect class="cell" x="892" y="214" width="16" height="16" rx="3" style="animation-delay:0.34s"/><rect class="cell" x="912" y="214" width="16" height="16" rx="3" style="animation-delay:0.46s"/><rect class="cell" x="852" y="234" width="16" height="16" rx="3" style="animation-delay:0.58s"/><rect class="cell" x="872" y="234" width="16" height="16" rx="3" style="animation-delay:0.70s"/><rect class="cell" x="892" y="234" width="16" height="16" rx="3" style="animation-delay:0.82s"/><rect class="cell" x="912" y="234" width="16" height="16" rx="3" style="animation-delay:0.94s"/><rect class="cell" x="852" y="254" width="16" height="16" rx="3" style="animation-delay:0.15s"/><rect class="cell" x="872" y="254" width="16" height="16" rx="3" style="animation-delay:0.27s"/><rect class="cell" x="892" y="254" width="16" height="16" rx="3" style="animation-delay:0.39s"/><rect class="cell" x="912" y="254" width="16" height="16" rx="3" style="animation-delay:0.51s"/><rect class="cell" x="852" y="274" width="16" height="16" rx="3" style="animation-delay:0.63s"/><rect class="cell" x="872" y="274" width="16" height="16" rx="3" style="animation-delay:0.75s"/><rect class="cell" x="892" y="274" width="16" height="16" rx="3" style="animation-delay:0.87s"/><rect class="cell" x="912" y="274" width="16" height="16" rx="3" style="animation-delay:0.99s"/>
    <text x="890" y="316" fill="#8993a5" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">32 slots</text>

    <line x1="934" y1="214" x2="992" y2="214" stroke="#1d3b47" stroke-width="1.2"/>
    <circle class="pkt-out" cx="934" cy="214" r="2.6" fill="#22d3ee"/>
    <circle class="ring" cx="1052" cy="214" r="66" fill="none" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2" stroke-dasharray="70 345"/>
    <rect x="994" y="164" width="116" height="100" rx="16" fill="#0a0c14" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="1052" y="207" fill="#e5e7eb" font-size="19" font-weight="700" text-anchor="middle" font-family="'Space Grotesk', Inter, sans-serif">Embed<tspan fill="#ff2d2d">IDS</tspan></text>
    <text x="1052" y="228" fill="#22d3ee" font-size="10" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace">detector · 100 ms</text>

    <g class="alert">
      <rect x="960" y="318" width="186" height="36" rx="8" fill="#2a0d14" stroke="#f74d67" stroke-opacity=".7"/>
      <text x="976" y="341" fill="#ff8a9c" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace">alert request_rate 256 &gt; 32</text>
    </g>
  </g>
</svg>
