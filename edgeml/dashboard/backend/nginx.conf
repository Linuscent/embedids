# EmbedIDS EdgeML dashboard: static frontend + reverse proxy to the agent API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:" always;

    # Re-resolve the agent through Docker's DNS so a restarted agent
    # container (new IP) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent_upstream http://embedids-agent:8081;

    location /api/ {
        # With a variable upstream the original /api/... URI is forwarded;
        # the agent serves every route under /api as well.
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_connect_timeout 2s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
