<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="EmbedIDS EdgeML architecture">
  <title>EmbedIDS EdgeML architecture: collectors, normalization, EmbedIDS core, rules, correlation, outputs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b90"/>
    </marker>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #e6ebf5; }
    .m { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; fill: #8b97b3; font-size: 12px; }
    .muted { fill: #8b97b3; }
    .layer { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #5b6b90; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .card { fill: #121a2e; stroke: #24314f; stroke-width: 1.5; }
    .arrow { stroke: #5b6b90; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>

  <rect width="1200" height="860" rx="22" fill="#0b1020"/>
  <text class="t" x="40" y="50" font-size="24" font-weight="700">Architecture</text>
  <text class="t muted" x="40" y="76" font-size="14">Collection, normalization, detection, correlation and alerting are separate layers. Only the collectors know the hardware.</text>

  <!-- Layer 1: collectors -->
  <text class="t layer" x="40" y="122">COLLECTORS · HARDWARE ABSTRACTION</text>
  <g>
    <rect class="card" x="40" y="134" width="270" height="128" rx="14"/>
    <circle cx="66" cy="160" r="6" fill="#3ccf7a"/>
    <text class="t h" x="82" y="166">Simulation</text>
    <text class="t s muted" x="58" y="192">Jetson-class device model</text>
    <text class="m" x="58" y="216">GPU · inference · network</text>
    <text class="m" x="58" y="234">processes · 9 attack scenarios</text>
    <text class="t" x="292" y="166" font-size="11" font-weight="700" fill="#3ccf7a" text-anchor="end">IN USE</text>

    <rect class="card" x="326" y="134" width="270" height="128" rx="14"/>
    <circle cx="352" cy="160" r="6" fill="#4ea1ff"/>
    <text class="t h" x="368" y="166">Linux</text>
    <text class="t s muted" x="344" y="192">Any embedded Linux host</text>
    <text class="m" x="344" y="216">/proc/stat · meminfo · [pid]</text>
    <text class="m" x="344" y="234">/proc/net/tcp · /sys thermal</text>
    <text class="t" x="578" y="166" font-size="11" font-weight="700" fill="#4ea1ff" text-anchor="end">IMPLEMENTED</text>

    <rect class="card" x="612" y="134" width="270" height="128" rx="14" stroke="#76b900"/>
    <circle cx="638" cy="160" r="6" fill="#76b900"/>
    <text class="t h" x="654" y="166">Jetson</text>
    <text class="t s muted" x="630" y="192">NVIDIA L4T telemetry interfaces</text>
    <text class="m" x="630" y="216">tegrastats · GPU load sysfs</text>
    <text class="m" x="630" y="234">power rails · TensorRT stats</text>
    <text class="t" x="864" y="166" font-size="11" font-weight="700" fill="#f5b83d" text-anchor="end">HW VALIDATION NEXT</text>

    <rect class="card" x="898" y="134" width="262" height="128" rx="14"/>
    <circle cx="924" cy="160" r="6" fill="#ef2b2d"/>
    <text class="t h" x="940" y="166">Self-protection</text>
    <text class="t s muted" x="916" y="192">Every platform</text>
    <text class="m" x="916" y="216">SHA-256 model &amp; config</text>
    <text class="m" x="916" y="234">agent CPU · RSS · heartbeat</text>
  </g>

  <path class="arrow" d="M600 266 V300"/>
  <text class="m" x="616" y="290">MetricCollector::collect(TelemetryBatch&amp;)</text>

  <!-- Layer 2: normalization -->
  <text class="t layer" x="40" y="322">NORMALIZATION</text>
  <rect class="card" x="40" y="334" width="1120" height="74" rx="14"/>
  <g>
    <text class="t h" x="64" y="364">Common telemetry schema</text>
    <text class="t s muted" x="64" y="388">timestamp · device_id · source · metric · value · unit · labels</text>
    <line x1="560" y1="350" x2="560" y2="392" stroke="#24314f"/>
    <text class="t h" x="584" y="364">Heartbeats &amp; allow-list policies</text>
    <text class="t s muted" x="584" y="388">processes, destinations and model readers → security.* metrics</text>
  </g>

  <path class="arrow" d="M600 412 V446"/>

  <!-- Layer 3: EmbedIDS core -->
  <text class="t layer" x="40" y="468">DETECTION</text>
  <rect x="40" y="480" width="1120" height="96" rx="14" fill="url(#core)" stroke="#ef2b2d" stroke-width="1.5"/>
  <g transform="translate(66,500)">
    <g stroke="#e6ebf5" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="-6" x2="12" y2="0"/><line x1="28" y1="-6" x2="28" y2="0"/><line x1="44" y1="-6" x2="44" y2="0"/>
      <line x1="12" y1="56" x2="12" y2="62"/><line x1="28" y1="56" x2="28" y2="62"/><line x1="44" y1="56" x2="44" y2="62"/>
      <line x1="-6" y1="16" x2="0" y2="16"/><line x1="-6" y1="40" x2="0" y2="40"/>
      <line x1="56" y1="16" x2="62" y2="16"/><line x1="56" y1="40" x2="62" y2="40"/>
    </g>
    <rect width="56" height="56" rx="8" fill="#0b1020" stroke="#e6ebf5" stroke-width="2.5"/>
    <rect x="12" y="38" width="14" height="5" rx="1.5" fill="#ef2b2d"/>
    <rect x="30" y="38" width="14" height="5" rx="1.5" fill="#ef2b2d"/>
    <path d="M12 16 h14 l1 20 h-16 z M30 16 h14 l1 20 h-16 z" fill="#e6ebf5"/>
  </g>
  <text class="t" x="150" y="516" font-size="18" font-weight="800">Embed<tspan fill="#ef2b2d">IDS</tspan> core <tspan class="muted" font-size="13" font-weight="400">  C11 · zero heap allocation</tspan></text>
  <text class="t s muted" x="150" y="542">12 metrics with fixed history ring buffers · 15 signals: built-in thresholds and</text>
  <text class="t s muted" x="150" y="560">a custom “sustained for N seconds” algorithm · every algorithm evaluated each cycle</text>
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12">
    <rect x="800" y="500" width="336" height="28" rx="8" fill="#0b1020" stroke="#3a2a40"/>
    <text x="814" y="519" fill="#ff8a6f">gpu.utilization &gt; 85 for 10 s</text>
    <rect x="800" y="534" width="336" height="28" rx="8" fill="#0b1020" stroke="#3a2a40"/>
    <text x="814" y="553" fill="#ff8a6f">ai.inference.rate &lt; 20 for 10 s</text>
  </g>

  <path class="arrow" d="M600 580 V612"/>

  <!-- Layer 4: rules + correlation -->
  <rect class="card" x="40" y="620" width="548" height="96" rx="14"/>
  <text class="t h" x="64" y="652">11 deterministic rules</text>
  <text class="t s muted" x="64" y="676">GPU anomaly · rogue / privileged process · unknown destination</text>
  <text class="t s muted" x="64" y="696">exfiltration · model &amp; config integrity · heartbeat · exhaustion</text>

  <path class="arrow" d="M592 668 H608"/>

  <rect class="card" x="612" y="620" width="548" height="96" rx="14" stroke="#e0398f"/>
  <text class="t h" x="636" y="652">Multi-signal correlation</text>
  <text class="t s muted" x="636" y="676">Rule-based incidents within a time window, with the</text>
  <text class="t s muted" x="636" y="696">contributing alerts and evidence attached</text>

  <path class="arrow" d="M600 720 V752"/>

  <!-- Layer 5: outputs -->
  <text class="t layer" x="40" y="752">ALERTS &amp; INTERFACES</text>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="40" y="764" width="168" height="48" rx="12" fill="#18223b" stroke="#4ea1ff"/>
    <text x="124" y="794" fill="#e6ebf5" text-anchor="middle">REST API</text>
    <rect x="226" y="764" width="168" height="48" rx="12" fill="#18223b" stroke="#4ea1ff"/>
    <text x="310" y="794" fill="#e6ebf5" text-anchor="middle">Live dashboard</text>
    <rect x="412" y="764" width="168" height="48" rx="12" fill="#18223b" stroke="#24314f"/>
    <text x="496" y="794" fill="#e6ebf5" text-anchor="middle">JSON lines</text>
    <rect x="598" y="764" width="168" height="48" rx="12" fill="#18223b" stroke="#24314f"/>
    <text x="682" y="794" fill="#e6ebf5" text-anchor="middle">Syslog RFC 5424</text>
    <rect x="784" y="764" width="168" height="48" rx="12" fill="#18223b" stroke="#24314f"/>
    <text x="868" y="794" fill="#e6ebf5" text-anchor="middle">Webhook</text>
    <rect x="970" y="764" width="190" height="48" rx="12" fill="#18223b" stroke="#24314f"/>
    <text x="1065" y="794" fill="#e6ebf5" text-anchor="middle">SQLite + retention</text>
  </g>
  <text class="t muted" x="1160" y="840" font-size="12" text-anchor="end">Detection code links only against the core: no Jetson or Linux API can leak into it.</text>
</svg>
