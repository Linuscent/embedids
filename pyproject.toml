[project]
name = "embedids"
version = "0.1.0"
description = "Modern Intrusion Detection System (IDS) for Embedded Systems"
authors = [
    {name = "Linuscent Ltd",email = "info@linuscent.com"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "mkdocs-material[imaging] (>=9.7.7,<10.0.0)",
    "mike (>=2.2.0,<3.0.0)",
    "mkdocs-git-revision-date-localized-plugin (>=1.6.0,<2.0.0)",
    "mkdocs-git-committers-plugin-2 (>=2.5.0,<3.0.0)",
    "mkdocs-glightbox (>=0.5.2,<0.6.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
